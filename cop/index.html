            title: '지도레이어관리',

            dataPath: '/data',
            xmlEncoding: 'euc-kr',

            onLayerChange: function (layer, visible) {
              console.log(
                '레이어 변경:',
                layer.source,
                visible
              );

              // Cesium 또는 MapX 레이어 표시/숨김 처리
              // setLayerVisible(layer.source, visible);
            },

            onXmlLoadError: function (error) {
              console.error(
                'XML 로딩 오류:',
                error
              );
            }
          });

          LayerManager.open();
